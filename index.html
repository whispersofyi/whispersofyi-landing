<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Minimal SEO (Gate Page, Non-Competitive) -->
  <title>Whispers of YI</title>

  <meta name="description"
        content="Where elemental rhythms quietly reveal themselves.">

  <meta name="robots" content="index, follow">

  <link rel="canonical" href="https://whispersofyi.com/">

  <!-- Open Graph (Brand Only) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Whispers of YI">
  <meta property="og:description"
        content="Where elemental rhythms quietly reveal themselves.">
  <meta property="og:url" content="https://whispersofyi.com/">
  <meta property="og:image"
        content="https://whispersofyi.com/images/og-image.jpg">

  <!-- Favicon & App Icons -->
  <link rel="icon" href="images/favicon.ico" sizes="any">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

  <!-- Browser UI -->
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- Security Hardening -->
  <meta http-equiv="Content-Security-Policy"
        content="
          default-src 'self';
          img-src 'self' data:;
          style-src 'self';
          font-src 'self';
          script-src 'none';
          object-src 'none';
          base-uri 'none';
          frame-ancestors 'none';
          form-action 'none';
          upgrade-insecure-requests;
        ">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
  <meta http-equiv="Permissions-Policy"
        content="
          geolocation=(),
          microphone=(),
          camera=(),
          payment=(),
          usb=(),
          accelerometer=(),
          gyroscope=(),
          magnetometer=()
        ">

  <!-- Core Design System -->
  <link rel="stylesheet" href="css/_variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/landing.css" />
</head>

<body>
  <main class="landing-root">
    <div class="landing-center">
      <img
        src="images/logo.svg"
        alt="Whispers of YI"
        class="landing-logo"
      />

      <h1 class="landing-lead">
        Where elemental rhythms quietly reveal themselves.
      </h1>

      <div class="landing-actions">
        <a href="https://whispers-of-yi.onrender.com" class="btn">
          Enter the Site
        </a>

        <a
          href="https://whispersofyi.gumroad.com/"
          class="landing-secondary"
          target="_blank"
          rel="noopener noreferrer"
        >
          Guides &amp; companions →
        </a>
      </div>
    </div>

    <img
      src="images/dao.png"
      alt=""
      class="dao-mark"
      aria-hidden="true"
    />
  </main>
</body>
</html>
